<body><main class="app"><header><b>CPL <small>研究室・CPL-DEV</small></b><a href="index.html">HOME</a></header>
<section id="auth"><h1>研究室</h1><p>Googleログインして研究を始めます。</p><button id="login">CPL-DEVでログイン</button></section>
<section id="workspace" hidden><nav><button data-view="suitability">適性入力</button><button data-view="condition">状態入力</button><button data-view="summary">集計</button><button data-view="records">記録</button></nav>
<div id="message" role="status" aria-live="polite" hidden><span id="messageText"></span><button id="messageDismiss" type="button" aria-label="通知を閉じる">閉じる</button></div>
<section id="suitability" class="view"><div id="suitRace"></div><div id="suitHorseWork" hidden><div class="card suitability-card"><div id="horseTabs" class="tabs" aria-label="着順を選択"></div><div id="horseEditor"></div><button id="addHorse" class="secondary">＋ 同着馬を追加</button></div><button id="saveSuitability" class="primary">適性を保存</button></div></section>
<section id="condition" class="view" hidden><div id="conditionRace"></div><div id="conditionWork" hidden>
<div class="card condition-card"><div id="conditionResult"></div><div class="condition-group"><strong>気になった状態</strong><div id="conditionChoices" class="condition-choices"></div></div></div>
<button id="saveCondition" class="primary">状態と結果を保存</button></div></section>
<section id="summary" class="view" hidden><h1>研究集計</h1><div id="filters" class="card fields"></div><div class="card"><div class="row"><h2>胸前 × トモ</h2><button id="merge">詳細 24通り</button></div><p class="help">対象条件の記録済み好走馬に占める割合です。全出走馬に対する好走率ではありません。</p><p id="sample"></p><div id="silhouette" aria-hidden="true"><svg viewBox="0 0 180 90"><path d="M16 51 Q28 42 49 44 Q67 23 104 37 L135 34 L145 15 L153 16 L157 39 L169 47 L164 56 L151 56 L143 49 L132 53 L123 81 L114 81 L111 55 L71 59 L58 81 L49 81 L50 58 L30 60 Z" fill="#665e49"/></svg></div><div id="matrix"></div><div id="toneBreakdown"></div></div><div class="card"><h2>状態研究</h2><p class="help">目立った馬を選んだ記録内の成績です。未記録馬・未選択項目は母数に入りません。</p><div id="conditionSummary"></div></div></section>
<section id="records" class="view" hidden><h1>研究記録</h1><div id="recordsList"></div><div class="account-actions"><button id="logout" class="secondary">ログアウト</button></div></section>
</section></main>
