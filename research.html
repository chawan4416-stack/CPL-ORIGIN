<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src https://kczisspagwqzdvaeemir.supabase.co; object-src 'none'; base-uri 'self'">
<title>CPL｜適性・状態研究 DEV</title><link rel="stylesheet" href="research.css?v=20260928-14"></head>
<body><main class="app"><header><b>CPL <small>研究室・CPL-DEV</small></b><a href="index.html">HOME</a></header>
<section id="auth"><h1>研究室</h1><p>Googleログインして研究を始めます。</p><button id="login">CPL-DEVでログイン</button></section>
<section id="workspace" hidden><nav><button data-view="suitability">適性入力</button><button data-view="condition">状態入力</button><button data-view="summary">集計</button><button data-view="records">記録</button></nav>
<div id="message" role="status" aria-live="polite" hidden><span id="messageText"></span><button id="messageDismiss" type="button" aria-label="通知を閉じる">閉じる</button></div>
<section id="suitability" class="view"><h1>適性研究</h1><div id="suitRace"></div><div class="card suitability-card"><div id="horseTabs" class="tabs" aria-label="着順を選択"></div><div id="horseEditor"></div><button id="addHorse" class="secondary">＋ 同着馬を追加</button></div><button id="saveSuitability" class="primary">適性を保存</button></section>
<section id="condition" class="view" hidden><h1>状態研究</h1><p>結果が分かった馬の、目立った状態だけを記録</p>
<div class="card"><h2>気になった状態</h2><div id="conditionChoices" class="choices"></div><p class="help">未選択は「記録対象外」。異常なしとは扱いません。</p></div><div id="conditionRace"></div>
<div class="card"><h2>馬と公式結果</h2><div class="fields"><label>馬番<select id="cHorse"></select></label><label>結果<select id="cOutcome"><option value="placed">1〜3着</option><option value="finished_other">着外</option><option value="dnf">競走中止</option><option value="scratched">出走取消</option></select></label><label id="cRankWrap">着順<select id="cRank"><option value="1">1着</option><option value="2">2着</option><option value="3">3着</option></select></label><label id="cPopularityWrap">人気<select id="cPopularity"></select></label></div><p class="help">同着は複数の馬に同じ公式着順を登録できます。取消は人気なし、中止は着順なしです。</p></div><button id="saveCondition" class="primary">状態と結果を保存</button></section>
<section id="summary" class="view" hidden><h1>研究集計</h1><div id="filters" class="card fields"></div><div class="card"><div class="row"><h2>胸前 × トモ</h2><button id="merge">詳細 24通り</button></div><p class="help">対象条件の記録済み好走馬に占める割合です。全出走馬に対する好走率ではありません。</p><p id="sample"></p><div id="silhouette" aria-hidden="true"><svg viewBox="0 0 180 90"><path d="M16 51 Q28 42 49 44 Q67 23 104 37 L135 34 L145 15 L153 16 L157 39 L169 47 L164 56 L151 56 L143 49 L132 53 L123 81 L114 81 L111 55 L71 59 L58 81 L49 81 L50 58 L30 60 Z" fill="#665e49"/></svg></div><div id="matrix"></div><div id="toneBreakdown"></div></div><div class="card"><h2>状態研究</h2><p class="help">目立った馬を選んだ記録内の成績です。未記録馬・未選択項目は母数に入りません。</p><div id="conditionSummary"></div></div></section>
<section id="records" class="view" hidden><h1>研究記録</h1><div id="recordsList"></div><div class="account-actions"><button id="logout" class="secondary">ログアウト</button></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/beta-config.js?v=20260924-1"></script><script src="research.js?v=20260928-8"></script></body></html>
