<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self'; img-src 'self' data:; connect-src https://kczisspagwqzdvaeemir.supabase.co; object-src 'none'; base-uri 'self'">
<title>CPL｜適性・状態研究 DEV</title><link rel="stylesheet" href="research.css?v=20260929-48"></head>
<body><main class="app"><header><b>CPL <small>研究室・CPL-DEV</small></b><a href="index.html">HOME</a></header>
<section id="auth"><h1>研究室</h1><p>Googleログインして研究を始めます。</p><button id="login">CPL-DEVでログイン</button></section>
<section id="workspace" hidden><nav><button data-view="suitability">適性研究</button><button data-view="condition">状態研究</button><button data-view="summary">集計</button><button data-view="records">記録</button></nav>
<div id="message" role="status" aria-live="polite" hidden><span id="messageText"></span><button id="messageDismiss" type="button" aria-label="通知を閉じる">閉じる</button></div>
<section id="suitability" class="view"><div id="suitRace"></div><div id="suitHorseWork" hidden><div class="card suitability-card"><div id="horseTabs" class="tabs" aria-label="着順を選択"></div><div id="horseEditor"></div><button id="addHorse" class="secondary">＋ 同着馬を追加</button></div><button id="saveSuitability" class="primary">適性を保存</button></div></section>
<section id="condition" class="view" hidden><div id="conditionRace"></div><div id="conditionWork" hidden>
<div class="card condition-card"><div id="conditionResult"></div><div class="condition-group"><strong>気になった状態</strong><div id="conditionChoices" class="condition-choices"></div></div></div>
<button id="saveCondition" class="primary">状態と結果を保存</button></div></section>
<section id="summary" class="view" hidden><h1>適性研究 集計</h1>
  <div id="filters" class="card summary-filters" aria-label="基本検索条件"></div>
  <div class="card summary-figure-card"><div class="summary-context"><strong id="summaryTitle"></strong><span id="sample"></span></div>
    <div id="summaryEmpty" class="summary-empty" hidden></div>
    <div id="summaryVisual" hidden><div class="horse-art" id="horseArt" role="img" aria-label="胸前とトモの選択された組み合わせ">
      <svg viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <defs><mask id="horseBodyMask" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse" x="0" y="0" width="1536" height="1024" style="mask-type:alpha"><image href="assets/horse-ink-diagram.webp" width="1536" height="1024"/></mask></defs>
        <image href="assets/horse-ink-diagram.webp" width="1536" height="1024"/>
        <!-- Fixed anatomical paths; only their fill colors change with the selected result. -->
        <path id="horseChestFill" class="horse-patch" mask="url(#horseBodyMask)" d="M489 375 C509 388 535 409 557 427 C577 445 602 462 620 482 L647 511 C656 527 659 548 654 563 C632 565 611 580 598 602 L583 648 C575 616 565 595 542 582 C519 568 495 558 482 535 C472 517 472 491 469 467 C466 435 471 398 489 375 Z"/>
        <path id="horseHindFill" class="horse-patch" mask="url(#horseBodyMask)" d="M1006 276 C1032 254 1072 244 1104 246 C1143 247 1170 258 1202 272 C1235 288 1255 309 1270 337 C1283 363 1287 399 1281 433 L1268 497 C1259 535 1249 573 1231 610 C1218 613 1208 620 1197 626 L1179 648 C1170 617 1154 590 1136 575 C1122 565 1110 563 1098 556 C1082 542 1078 523 1059 508 C1033 488 1015 469 1003 437 C992 409 994 371 994 343 C996 317 999 294 1006 276 Z"/>
        <!-- The original ink sits above the fills, preserving contours and muscle hatching. -->
        <image class="horse-ink-front" href="assets/horse-ink-diagram.webp" width="1536" height="1024"/>
        <path class="horse-callout chest-callout" d="M301 686 L568 458"/><circle class="horse-dot chest-dot" cx="568" cy="458" r="9"/>
        <path class="horse-callout hind-callout" d="M1312 158 L1154 382"/><circle class="horse-dot hind-dot" cx="1154" cy="382" r="9"/>
      </svg><span class="horse-tag chest-tag"><small>胸前</small><b id="chestValue"></b></span><span class="horse-tag hind-tag"><small>トモ</small><b id="hindValue"></b></span>
    </div></div>
  </div>
  <div id="topCombos" class="card summary-top" hidden><h2>上位の馬体組み合わせ</h2><div id="topComboList"></div></div>
  <button id="detailsToggle" class="summary-details-button" type="button" hidden aria-expanded="false">詳細を見る <span aria-hidden="true">›</span></button>
  <div id="summaryDetails" class="card summary-details" hidden><h2>胸前 × トモ　24通り</h2><div id="matrix"></div><details class="condition-detail"><summary>状態研究の集計</summary><div id="conditionSummary"></div></details></div>
</section>
<section id="records" class="view" hidden><h1>研究記録</h1><div id="recordsList"></div><div class="account-actions"><button id="logout" class="secondary">ログアウト</button></div></section>
</section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/beta-config.js?v=20260924-1"></script><script src="suitability-summary.js?v=20260929-1"></script><script src="research.js?v=20260929-20"></script></body></html>
